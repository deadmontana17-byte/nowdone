server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Attachment uploads (images/videos) are proxied through this server to the
    # backend, which accepts up to 25 MB. Nginx's default limit is only 1 MB, so
    # without this every non-tiny upload is rejected with 413 before reaching Go.
    client_max_body_size 25m;

    # PWA service worker must never be cached long-term.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container so the browser only ever talks
    # to this origin (matches default VITE_API_BASE_URL=/api). Cookies pass
    # through untouched so the http-only session cookie keeps working.
    location /api/ {
        # Docker's embedded DNS at 127.0.0.11; resolving via a variable (instead
        # of a bare hostname in proxy_pass) makes nginx re-resolve "backend" on
        # each request instead of caching its IP for the life of the worker
        # process, so a backend container recreate/restart doesn't 502 until
        # frontend is also restarted.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        # proxy_pass with a variable disables nginx's normal "strip the
        # matched location prefix" rewrite, so /api/ must be stripped
        # explicitly here instead (and proxy_pass below carries no URI part).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploading a 25 MB file to S3 through the backend can outlast nginx's
        # default 60s proxy timeouts; the backend caps the upload at 120s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
