services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nowdone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nowdone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
 #   ports:
 #     - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nowdone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      # Optional: reverse-proxy origin for the Telegram Bot API (e.g. a Cloudflare
      # Worker). Empty => https://api.telegram.org.
      TELEGRAM_API_PROXY_URL: ${TELEGRAM_API_PROXY_URL}
      BOT_USERNAME: ${BOT_USERNAME:?BOT_USERNAME is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_PRESIGN_EXPIRY: ${S3_PRESIGN_EXPIRY:-15}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      API_PORT: 8080
      MIGRATIONS_PATH: /app/migrations
    ports:
      - "8080:8080"

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      ENV: ${ENV:-production}
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_PROXY_URL: ${TELEGRAM_API_PROXY_URL}
      BOT_USERNAME: ${BOT_USERNAME}
      SITE_URL: ${SITE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # The bot uploads photo/video/file attachments sent in chat to S3.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_PROXY_URL: ${TELEGRAM_API_PROXY_URL}
      BOT_USERNAME: ${BOT_USERNAME}
      SITE_URL: ${SITE_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
